# Game-ready 校验规则配置
#
# 三级回落：categories[类目] > defaults > 代码内置默认（app/tools/validate.py）。
# 技术美术可以直接改这个文件调阈值，不用碰 Python —— 这是 T3 轨道的落点。
#
# severity 可选 fail / warn：warn 表示"报告里标黄，但不阻断导出"。
#
# 阈值来源（2026-09-11 拍板：从行业通行规范提取，见产品策划文档 12）：
#   - Unity：1 unit = 1 米；贴图需 2 的幂才能开 mipmap 与压缩格式
#     （Unity 手册 "Importing textures" / "Model import formats"）
#   - Unreal：1 uu = 1 厘米；静态网格命名惯用 SM_ 前缀
#     （UE 官方 "Cleaning up Geometry" / Epic 资产命名规范）
#   - 面数预算：通行口径为背景道具 LOD0 约 0.5k–3k 三角面、标准道具 3k–10k、
#     英雄级道具 10k–20k+（主流工作室美术口径与引擎市场资产基准）
#   - UV：至少留 1–2 texel 间距是双线性过滤不串色的硬下限；
#     做烘焙的项目普遍建议 4–16px @2k–4k（Substance / Marmoset 烘焙指南口径）
#   - 轴心：道具/陈设统一底面中心，配合 Unity 网格吸附与 UE 落地摆放
# 以上为 AI 从训练语料提取的通行值，**上线前仍应请 TA 按目标项目复核一轮**
# （ROADMAP T3：W0 拿真实阈值）。

version: 1

defaults:
  # 面数预算：标准道具 LOD0 默认 5000 三角面，类目可覆盖
  # 依据：标准道具通行区间 3k–10k；背景道具收紧到 0.5k–3k（见 blocker/foliage）
  face_budget:
    enabled: true
    severity: fail
    max: 5000

  # 四边面比例：硬表面 ≥ 85%
  # 依据：硬表面重拓扑的通行质量线（四边面为主 + 少量三角收边）。
  #
  # ⚠️ MVP 期间默认关闭。原因：自动四边面重拓扑是全链路技术不确定性最高的一环，
  # 是否真做要等 Spike 结论（见产品策划文档 5.4.3）。
  # 在结论出来之前开着它，只会让每一份报告都挂一条我们知道但暂时解决不了的红灯，
  # 反而让美术对整个校验器失去信任。Spike 通过后把 enabled 改回 true。
  quad_ratio:
    enabled: false
    severity: fail
    min: 0.85

  # N-gon：0 个
  # 依据：引擎导入时都会三角化，但 n-gon 的三角化方向不可控，会破坏法线与烘焙，
  # 交付网格"零 n-gon"是通行交付卫生标准。
  ngon:
    enabled: true
    severity: fail
    max: 0

  # UV 重叠：0 个面
  # 依据：UV 重叠必然导致烘焙/光照图串色，标准即 0。
  #
  # 管线在展开后会跑"UV 岛重打包"后处理（app/tools/uv.py repack_uv_islands）：
  # 岛间空隙由构造保证，"零重叠"与"岛间距"两条同时满足，所以这条按行业口径
  # FAIL。极端情况（岛内折叠）复核仍剩重叠时，版本 stats 里记 uv_overlap_remaining，
  # 本规则照常 FAIL，交美术决定（重跑/手动处理/忽略导出）。
  uv_overlap:
    enabled: true
    severity: fail
    max_faces: 0

  # UV 岛间距：4K 贴图基准下 ≥ 2px
  # 依据：1–2 texel 是双线性过滤不串色的硬下限，2px@4k 取的是"能用"的底线；
  # 做烘焙的项目建议按上面来源说明上调到 4–8px（改 min_px 即可）。
  # M3 换 Smart UV Project 之后可随项目基调收紧。
  uv_island_margin:
    enabled: true
    severity: fail
    min_px: 2.0
    reference_resolution: 4096

  # 轴心：底面中心
  # 依据：道具/陈设的通行摆轴方式 —— UE 里落地即贴地、Unity 网格吸附不穿模；
  # 武器/手持件等特殊类目可按类目覆盖为 origin。
  pivot:
    enabled: true
    severity: fail
    mode: bottom_center
    tolerance_m: 0.02

  # 真实单位：米制，与规格期望尺寸偏差 ≤ ±5%
  # 依据：Unity 1 unit = 1m 是引擎原生口径；UE 的 1uu = 1cm 由导出预设换算，
  # 内部统一米制（recipes/presets/export_presets.yaml）。
  units:
    enabled: true
    severity: fail
    unit: meter
    tolerance_ratio: 0.05

  # 命名：引擎规范正则
  # 依据：SM_ 前缀是 UE 静态网格的官方推荐前缀（Epic 命名规范）；
  # Unity 没有引擎级强制前缀，这里作为仓库统一约定沿用。
  # Unity 项目想放宽时按类目覆盖 pattern 即可。
  naming:
    enabled: true
    severity: fail
    pattern: "^SM_[A-Za-z0-9_]+$"

  # 贴图：分辨率必须是 2 的幂
  # 依据：Unity 中非 POT 贴图无法正常生成 mipmap、多数压缩格式不可用
  # （Unity 手册 "Importing textures"）；UE 宽松但 POT 仍利于流送与 mipmap。
  # 默认 warn 而不是 fail：贴图规格不对是"要改"，不是"不能用"
  texture:
    enabled: true
    severity: warn
    power_of_two: true

categories:
  # 道具 / 场景陈设（主力类目）
  prop: {}

  # 关卡灰盒 Blocker：只求体块能进引擎，规范从宽
  # 面数依据：灰盒体块通行口径 ~1–2k 三角面
  blocker:
    face_budget:
      max: 1500
    uv_island_margin:
      enabled: false      # 灰盒阶段不关心贴图
    texture:
      enabled: false
    naming:
      pattern: "^SM_Blocker_[A-Za-z0-9_]+$"

  # 植被优化形态：面数预算更紧，允许三角形
  # 岛间距依据：植被常叠叶 baking 光照，间距按"烘焙建议值"取 4px
  foliage:
    face_budget:
      max: 2500
    uv_island_margin:
      min_px: 4.0
